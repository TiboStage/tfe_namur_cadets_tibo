symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Durée de validité d'un lien de réinitialisation (secondes) — 1h
    lifetime: 3600
    # Délai minimum entre deux demandes pour un même utilisateur (anti-spam).
    # Volontairement court : le plafond horaire est géré par le rate limiter
    # "reset_password" (voir rate_limiter.yaml) — max 3 demandes / heure.
    throttle_limit: 120
